services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: gunicorn --workers 3 --worker-class gthread --threads 4 --timeout 120 --bind 0.0.0.0:8000 loop.wsgi:application
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ${LOOP_DATA_ROOT:?set LOOP_DATA_ROOT}/staticfiles:/app/staticfiles
      - ${LOOP_DATA_ROOT:?set LOOP_DATA_ROOT}/media:/app/media
      - ${LOOP_DATA_ROOT:?set LOOP_DATA_ROOT}/hf-cache:/hf-cache
      - ${LOOP_DATA_ROOT:?set LOOP_DATA_ROOT}/users:/app/sqlite
      - ${LOOP_DATA_ROOT:?set LOOP_DATA_ROOT}/raw-uploads:/app/raw-uploads
      # The JSON archive: the catalog's source of truth. MongoDB below is a
      # rebuildable index over it, so this bind mount is the one that must
      # survive a host rebuild and be included in offsite backups.
      - ${LOOP_DATA_ROOT:?set LOOP_DATA_ROOT}/archive:/app/archive
      - ${LOOP_DATA_ROOT:?set LOOP_DATA_ROOT}/CHAOS:/app/chaos-data
      # Trained EFA/DEED model artifacts. Without this mount they are written
      # to the container's own filesystem and destroyed on every recreation,
      # while the ModelVersion record in MongoDB survives. The app then thinks
      # it has an active model, fails to load the missing .pkl, and silently
      # renders every predicted column as "Not calculated" with no error shown.
      # CHEMSCREEN_MODEL_DIR in .env must point at this path.
      - ${LOOP_DATA_ROOT:?set LOOP_DATA_ROOT}/models:/app/models
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,s4e.ai
      DJANGO_SETTINGS_MODULE: loop.settings
      SUBPATH: /loop
      HF_HOME: /hf-cache
      STATIC_ROOT: /app/staticfiles
      MEDIA_ROOT: /app/media
      SQLITE_PATH: /app/sqlite/db.sqlite3
      RAW_UPLOADS_ROOT: /app/raw-uploads
      ARCHIVE_ROOT: /app/archive
      CHAOS_DB_PATH: /app/chaos-data/chaos.db
      MONGODB_URI: mongodb://mongodb:27017/loop
      MONGODB_RAW_URI: mongodb://mongodb:27017/loop_raw
    env_file:
      - .env
    depends_on:
      mongodb:
        condition: service_healthy
    restart: on-failure

  # Postfix on the host relays only for 127.0.0.0/8, so the app container is
  # refused with "454 Relay access denied" when it connects over the docker
  # bridge. This forwarder runs in the host network namespace, so its hop to
  # postfix originates from loopback and is accepted -- no postfix config
  # change, which would need root we do not have. It binds the bridge gateway
  # only, never mintaka's public interface, so it is not an open relay.
  mailrelay:
    image: alpine/socat:latest
    network_mode: host
    command: TCP-LISTEN:2525,bind=172.21.0.1,fork,reuseaddr TCP:127.0.0.1:25
    restart: unless-stopped

  mongodb:
    build:
      context: .
      dockerfile_inline: |
        FROM mongodb/mongodb-atlas-local:8.0.14
        USER root
        RUN usermod -u 110 mongod && groupmod -g 110 mongod \
            && find / -xdev -user 1000 -exec chown 110 {} + 2>/dev/null; \
               find / -xdev -group 1000 -exec chgrp 110 {} + 2>/dev/null; \
               true
        USER mongod
    hostname: mongodb
    volumes:
      - ${LOOP_DATA_ROOT:?set LOOP_DATA_ROOT}/mongodb:/data/db
      - ${LOOP_DATA_ROOT:?set LOOP_DATA_ROOT}/mongodb-configdb:/data/configdb
    environment:
      MONGO_INITDB_DATABASE: loop
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.runCommand({ ping: 1 }).ok\" && mongosh --quiet --port 27027 --eval \"db.runCommand({ ping: 1 }).ok\""]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 60s
    restart: on-failure
