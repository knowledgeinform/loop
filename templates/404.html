{% extends "base_generic.html" %}

{% block title %}
  <title>Page Not Found (404)</title>
{% endblock %}

{% block content %}
  <div class="container mt-5">
    <h1 class="text-danger text-center mb-4">Page Not Found (404)</h1>
    <p class="text-center">
      {% if message %}
        {{ message }}
      {% else %}
        Sorry, the page you requested doesn't exist.
      {% endif %}
    </p>
    <div class="text-center mt-4">
      <a href="{% url 'index' %}" class="btn btn-primary">Return to Home</a>
    </div>
  </div>
{% endblock %}
